name: Build and deploy

on: [push, pull_request]

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run pretty:check

            # To prevent build from running out of memory
            - name: Configure swap
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
              run: |
                  sudo swapoff -a
                  sudo rm -f /swapfile
                  sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
                  sudo chmod 600 /swapfile
                  sudo mkswap /swapfile
                  sudo swapon /swapfile
                  sudo sysctl vm.swappiness=10
                  df -h /

            - name: Build
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
              run: |
                  # Log memory every 10s
                  while true; do
                      echo "[mem] $(free -m | awk '/^Mem:/ {printf "used=%s avail=%s total=%s", $3, $7, $2} /^Swap:/ {printf " swap_used=%s swap_total=%s", $3, $2}') git_procs=$(pgrep -c git)"
                      sleep 10
                  done &
                  trap 'kill $!' EXIT
                  pnpm run build

            - name: Run tests
              run: pnpm run test

            - name: Add build.txt
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
              run: |
                  git log --pretty=format:'%h' -n 1 > dist/build.txt
                  echo >> dist/build.txt
                  date +%F_%T >> dist/build.txt

            # Disable Jekyll to prevent files starting with _ not working properly.
            - name: Create .nojekyll
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
              run: |
                  touch dist/.nojekyll

            - name: Deploy
              if: github.ref == 'refs/heads/master'
              uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  branch: gh-pages # The branch the action should deploy to.
                  folder: dist # The folder the action should deploy.
                  single-commit: true
                  clean: true
